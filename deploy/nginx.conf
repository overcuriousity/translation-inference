# nginx in front of translation-inference on the same host. The app owns all security headers; add none here.
# Replace translate.example.org and the certificate paths. For an airgapped box see AIRGAP.md.

server {
    listen 80;
    listen [::]:80;
    server_name translate.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name translate.example.org;

    ssl_certificate     /etc/ssl/certs/translate.example.org.pem;
    ssl_certificate_key /etc/ssl/private/translate.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Audio and video uploads; keep in step with upload_max_mb in config.toml.
    client_max_body_size 101m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Translations stream token by token as server-sent events, and long files take minutes.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
